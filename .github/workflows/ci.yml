name: CareFlow CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CareFlow.slnx
      - name: Build
        run: dotnet build CareFlow.slnx --configuration Release --no-restore
      - name: Unit tests
        run: dotnet test CareFlow.slnx --configuration Release --no-build
